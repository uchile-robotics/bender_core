# MoveIt uses this configuration for controller management.
# El prefijo bender/ es el namespace del controller_manager: MoveIt arma el
# nombre de la acción como <nombre>/<action_ns>.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - bender/left_shoulder_controller
    - bender/left_arm_controller
    - bender/right_shoulder_controller
    - bender/right_arm_controller
    - bender/head_controller
    - bender/left_gripper_controller
    - bender/right_gripper_controller

  bender/left_shoulder_controller:
    type: FollowJointTrajectory
    joints:
      - l1l_to_base_link
    action_ns: follow_joint_trajectory
    default: true
  bender/left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - l2l_to_l1l
      - l3l_to_l2l
      - l4l_to_l3l
      - l5l_to_l4l
      - l6l_to_l5l
    action_ns: follow_joint_trajectory
    default: true
  bender/right_shoulder_controller:
    type: FollowJointTrajectory
    joints:
      - l1r_to_base_link
    action_ns: follow_joint_trajectory
    default: true
  bender/right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - l2r_to_l1r
      - l3r_to_l2r
      - l4r_to_l3r
      - l5r_to_l4r
      - l6r_to_l5r
    action_ns: follow_joint_trajectory
    default: true
  bender/head_controller:
    type: FollowJointTrajectory
    joints:
      - l1h_to_base_link
      - l2h_to_l1h
      - l3h_to_l1h
    action_ns: follow_joint_trajectory
    default: true
  bender/left_gripper_controller:
    type: GripperCommand
    joints:
      - gripper_base_to_movil
    action_ns: gripper_cmd
    default: true
  bender/right_gripper_controller:
    type: GripperCommand
    joints:
      - g2ra_to_g1r
      - g2rb_to_g1r
    action_ns: gripper_cmd
    default: true