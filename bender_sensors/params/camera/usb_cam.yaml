# Microsoft LifeCam Cinema (usb_cam)
/**:
  ros__parameters:
    video_device: "/dev/usb_cam"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "usb_cam_link"
    # YUYV soporta 640x480 a 30 fps; 1280x720 baja a 10 fps
    pixel_format: "yuyv2rgb"
    av_device_format: "YUV422P"
    image_width: 640
    image_height: 480
    camera_name: "usb_cam"
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    auto_white_balance: true
    white_balance: 4000
    autoexposure: true
    exposure: 100
    autofocus: false
    focus: -1
